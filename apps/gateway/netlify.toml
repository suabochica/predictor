[build]
  command = "pnpm --filter @predictor/fantasy build && pnpm build && rm -rf dist/fantasy && cp -r ../fantasy/dist dist/fantasy && ls dist/fantasy/assets/*.js"
  publish = "dist"
  # This site also bundles the fantasy app and shared packages, so rebuild
  # when any of those change — not just apps/gateway (Netlify's default).
  # Build if: (a) there are changes since last deploy, OR (b) there's no prior
  # deploy to compare against (CACHED == COMMIT means fresh clone / no cache).
  ignore = "if [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../fantasy ../../packages ../../pnpm-lock.yaml ../../pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11"

[[redirects]]
  from = "/polla/*"
  to = "https://predictor-polla.netlify.app/polla/:splat"
  status = 200

[[redirects]]
  from = "/fantasy/*"
  to = "/fantasy/index.html"
  status = 200
