[build]
  command = "pnpm build && mkdir -p dist/polla && cp -r dist/_astro dist/polla/_astro"
  publish = "dist"
  # Polla imports shared packages, so rebuild when those change too —
  # not just apps/polla (Netlify's default).
  # Build if: (a) there are changes since last deploy, OR (b) there's no prior
  # deploy to compare against (CACHED == COMMIT means fresh clone / no cache).
  ignore = "if [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages ../../pnpm-lock.yaml ../../pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11"
